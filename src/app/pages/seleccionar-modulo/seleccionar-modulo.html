<div class="modulo-page" style="background-image: url('img/ImgFondo2.png')">
  <img class="modulo-logo" src="img/LogoSEGURIDAD.png"
    alt="Gobierno de México - Seguridad - Secretariado Ejecutivo">

  <section class="modulo-panel">
    <h1>Seleccione un módulo</h1>
    <p class="usuario">Bienvenido, {{ nombreUsuario() }}</p>

    <div class="modulo-grid">
      @for (modulo of modulos(); track modulo.idModulo) {
      <button type="button"
        class="modulo-card"
        [class.modulo-card-consolidado]="modulo.clave === 'MENSUAL'"
        [class.modulo-card-preliminar]="modulo.clave === 'SEMANAL'"
        [class.modulo-card-federal]="modulo.clave === 'FEDERAL'"
        (click)="seleccionar(modulo)">

        <span class="modulo-icon">
          @if (modulo.clave === 'MENSUAL') {
          <i class="fa-solid fa-calendar-days"></i>
          } @else if (modulo.clave === 'SEMANAL') {
          <i class="fa-solid fa-calendar-week"></i>
          } @else {
          <i class="fa-solid fa-landmark"></i>
          }
        </span>

        <strong>
          @if (modulo.clave === 'MENSUAL') {
          Consolidado
          } @else if (modulo.clave === 'SEMANAL') {
          Preliminar
          } @else {
          Federal
          }
        </strong>

        <span>
          @if (modulo.clave === 'MENSUAL') {
          Integración consolidada de incidencia delictiva.
          } @else if (modulo.clave === 'SEMANAL') {
          Integración y seguimiento preliminar de delitos configurados.
          } @else {
          Integración nacional de información de incidencia delictiva federal.
          }
        </span>
      </button>
      }
    </div>

    <button type="button" class="cerrar-sesion" (click)="cerrarSesion()">
      <i class="fa-solid fa-right-from-bracket"></i>
      <span>Cerrar sesión</span>
    </button>
  </section>
</div>
