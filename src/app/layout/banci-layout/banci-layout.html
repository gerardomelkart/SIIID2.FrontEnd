<div class="siiid-shell">
    <header class="p-3">
        <strong>BANCI</strong>
        <nav class="d-flex gap-3 flex-wrap mt-2">
            <a routerLink="/banci">Inicio</a>
            @if (usuario()?.rol === 'SUPER_USUARIO') {
                <a routerLink="/banci/usuarios">Usuarios</a>
            }
            <button type="button" class="btn btn-link p-0" (click)="cambiarModulo()">Cambiar módulo</button>
            <button type="button" class="btn btn-link p-0" (click)="salir()">Cerrar sesión</button>
        </nav>
    </header>
    <main class="p-3"><router-outlet></router-outlet></main>
</div>
